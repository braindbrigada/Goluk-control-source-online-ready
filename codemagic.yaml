workflows:
  goluk-debug:
    name: Goluk Control Debug APK
    max_build_duration: 60
    environment:
      vars:
        GRADLE_VERSION: "9.3.1"
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Install Android SDK packages
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Download Gradle 9.3.1
        script: |
          cd "$CM_BUILD_DIR"
          curl -L -o "gradle-${GRADLE_VERSION}-bin.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q -o "gradle-${GRADLE_VERSION}-bin.zip"
      - name: Build debug APK
        script: |
          "$CM_BUILD_DIR/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
