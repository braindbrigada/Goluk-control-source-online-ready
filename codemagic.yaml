workflows:
  goluk-debug:
    name: Goluk Control Debug APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      vars:
        GRADLE_PATH: "/home/builder/programs/gradle-8.13/bin/gradle"
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=/usr/local/share/android-sdk" > "$CM_BUILD_DIR/local.properties"
      - name: Check toolchain
        script: |
          /usr/local/share/android-sdk/cmdline-tools/latest/bin/sdkmanager --version
          "$GRADLE_PATH" --version
          java -version
      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR"
          "$GRADLE_PATH" --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
